<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Générateur de Screenshots iPad - Anime Legends</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,900&family=Outfit:wght@400;700&display=swap');

        :root {
            --primary: #B8A1FF;
            --accent: #8A6EEF;
            --dark: #0F0F14;
            --dark-card: #15151A;
        }

        body {
            background-color: #050505;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 100px;
            display: flex;
            flex-wrap: wrap;
            gap: 120px;
            justify-content: center;
        }

        /* --- THE MASTER CANVAS (iPad Pro 12.9" Dimensions) --- */
        .canvas {
            width: 2048px;
            height: 2732px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, #1A1A22 0%, #08080A 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 200px;
            flex-shrink: 0;
            /* Prevents browser from shrinking it if viewing zoomed out */
        }

        /* --- DYNAMIC BACKGROUND LAYERS --- */
        .effect-burst {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 250%;
            height: 250%;
            background: repeating-conic-gradient(from 0deg,
                    transparent 0deg,
                    transparent 10deg,
                    rgba(255, 255, 255, 0.015) 10.5deg,
                    transparent 11deg);
            transform: translate(-50%, -50%);
            z-index: 0;
            opacity: 0.6;
        }

        .effect-glow {
            position: absolute;
            top: -5%;
            left: 0;
            right: 0;
            height: 50%;
            background: radial-gradient(circle at 50% 30%, rgba(138, 110, 239, 0.25) 0%, transparent 70%);
            filter: blur(80px);
            z-index: 1;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            background: var(--primary);
            filter: blur(40px);
            opacity: 0.2;
            z-index: 2;
        }

        /* --- TYPOGRAPHY (Scaled up) --- */
        .text-container {
            margin-top: 280px;
            z-index: 10;
            position: relative;
            width: 100%;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 200px;
            font-weight: 900;
            font-style: italic;
            line-height: 0.9;
            margin: 0;
            text-transform: uppercase;
            color: #EDEDED;
            text-shadow:
                10px 10px 0px rgba(138, 110, 239, 0.4),
                0px 60px 120px rgba(0, 0, 0, 0.6);
            transform: skewX(-4deg);
            padding: 0 80px;
        }

        h2 {
            display: inline-block;
            margin-top: 50px;
            padding: 24px 80px;
            background: rgba(138, 110, 239, 0.15);
            border: 4px solid rgba(138, 110, 239, 0.3);
            border-radius: 400px;
            font-family: 'Outfit', sans-serif;
            font-size: 60px;
            font-weight: 700;
            letter-spacing: 12px;
            text-transform: uppercase;
            color: var(--primary);
            backdrop-filter: blur(20px);
            box-shadow: 0 15px 60px rgba(0, 0, 0, 0.3);
            transform: skewX(-4deg);
        }

        /* --- IPAD MOCKUP --- */
        .ipad-wrapper {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            margin-top: 150px;
            z-index: 5;
            position: relative;
        }

        .ipad-frame {
            width: 1600px;
            /* Proportional to 2048 canvas */
            height: 2200px;
            background: #000;
            border-radius: 60px;
            border: 35px solid #2B2B33;
            box-shadow:
                0 0 0 6px #15151A,
                0 100px 250px -50px rgba(0, 0, 0, 0.9);
            position: relative;
            overflow: hidden;
        }

        .ipad-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .reflection {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.1) 0%,
                    transparent 40%,
                    transparent 100%);
            pointer-events: none;
            z-index: 20;
        }

        .deco-line {
            position: absolute;
            height: 4px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
            opacity: 0.3;
            width: 100%;
            z-index: 2;
        }
    </style>
</head>

<body>

    <!-- SCREEN 1: PROFIL -->
    <div class="canvas">
        <div class="effect-burst"></div>
        <div class="effect-glow"></div>

        <div class="orb" style="width: 200px; height: 200px; top: 20%; left: 10%; background: #fff; opacity: 0.05;">
        </div>
        <div class="orb"
            style="width: 400px; height: 400px; bottom: 10%; right: -40px; background: #8A6EEF; opacity: 0.15;"></div>

        <div class="text-container">
            <h1>Deviens Une<br><span style="color: #B8A1FF">Légende</span></h1>
            <h2>Sur Grand Écran</h2>
        </div>

        <div class="ipad-wrapper">
            <div class="ipad-frame">
                <div class="reflection"></div>
                <img src="./assets/images/ipad_screen_profile.png" alt="Profile"
                    onerror="this.src='https://via.placeholder.com/2048x2732/1A1A22/B8A1FF?text=SCREEN+IPAD+PORTRAIT'">
            </div>
        </div>
    </div>

    <!-- SCREEN 2: GAMEPLAY -->
    <div class="canvas">
        <div class="effect-burst" style="transform: translate(-50%, -50%) rotate(45deg);"></div>
        <div class="effect-glow"></div>

        <div class="orb" style="width: 120px; height: 120px; top: 15%; right: 15%; background: var(--primary);"></div>
        <div class="deco-line" style="top: 38%; transform: rotate(-5deg);"></div>

        <div class="text-container">
            <h1>4 Images<br><span style="color: #fff">1 Anime</span></h1>
            <h2>Le Quiz Ultime</h2>
        </div>

        <div class="ipad-wrapper">
            <div class="ipad-frame">
                <div class="reflection"></div>
                <img src="./assets/images/ipad_screen_game.png" alt="Game"
                    onerror="this.src='https://via.placeholder.com/2048x2732/1A1A22/B8A1FF?text=SCREEN+IPAD+PORTRAIT'">
            </div>
        </div>
    </div>

    <!-- SCREEN 3: VICTORY -->
    <div class="canvas">
        <div class="effect-burst"></div>
        <div class="effect-glow"></div>

        <div class="orb"
            style="width: 600px; height: 600px; top: 30%; left: -200px; background: #8A6EEF; opacity: 0.1;"></div>

        <div class="text-container">
            <h1>Gagne des<br><span style="color: #B8A1FF">Affiches</span></h1>
            <h2>Récompense Unique</h2>
        </div>

        <div class="ipad-wrapper">
            <div class="ipad-frame">
                <div class="reflection"></div>
                <img src="./assets/images/ipad_screen_victory.png" alt="Victory"
                    onerror="this.src='https://via.placeholder.com/2048x2732/1A1A22/B8A1FF?text=SCREEN+IPAD+PORTRAIT'">
            </div>
        </div>
    </div>

    <!-- SCREEN 4: BADGES -->
    <div class="canvas">
        <div class="effect-burst" style="opacity: 0.8"></div>
        <div class="effect-glow"></div>

        <div class="deco-line" style="bottom: 20%; transform: rotate(10deg);"></div>
        <div class="orb" style="width: 300px; height: 300px; top: 10%; right: 30%; background: #fff; opacity: 0.05;">
        </div>

        <div class="text-container">
            <h1>Relève<br><span style="color: #B8A1FF">Les Défis</span></h1>
            <h2>Chasse aux Trophées</h2>
        </div>

        <div class="ipad-wrapper">
            <div class="ipad-frame">
                <div class="reflection"></div>
                <img src="./assets/images/ipad_screen_badges.png" alt="Badges"
                    onerror="this.src='https://via.placeholder.com/2048x2732/1A1A22/B8A1FF?text=SCREEN+IPAD+PORTRAIT'">
            </div>
        </div>
    </div>

</body>

</html>
